version: '3.8'

services:
  aqua-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqua_backend
    restart: always
    environment:
      # Database connection
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      
      # App Config
      PORT_APP: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      
      # Simulation is handled by the standalone service on VPS
      # So we disable the internal one to avoid conflict/double-write
      ENABLE_INTERNAL_SIMULATION: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - aqua-network
    # Use the same logging config as simulation for consistency
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Join the existing network if possible, or create a new one
networks:
  aqua-network:
    name: aqua-sentinel-network
    external: true  # Assuming simulation service created it
    # If network doesn't exist, remove 'external: true' and uncomment driver
    # driver: bridge
