<div class="ai-consultant-box">
  <div class="consultant-header">
    <h3>🤖 AI Consultant</h3>
    <button *ngIf="!isOpen" class="btn-toggle" (click)="toggleOpen()">Ask for Advice</button>
    <button *ngIf="isOpen" class="btn-toggle btn-close" (click)="toggleOpen()">Close</button>
  </div>

  <div *ngIf="isOpen" class="consultant-content">
    <div class="chat-messages">
      <div *ngFor="let message of messages()" [class]="'message message-' + message.type">
        <p class="message-text">{{ message.text }}</p>
        <span class="message-time">{{ message.timestamp | date: 'short' }}</span>
      </div>
    </div>

    <div class="consultant-input">
      <textarea
        [(ngModel)]="userInput"
        (keydown.enter)="sendMessage()"
        placeholder="Ask for water quality advice..."
        class="input-field"
      ></textarea>
      <button (click)="sendMessage()" class="btn btn-send">Send</button>
    </div>
  </div>
</div>
