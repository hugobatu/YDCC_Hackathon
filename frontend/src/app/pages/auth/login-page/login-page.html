<div class="login-page">
  <app-header></app-header>

  <main class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>Chào mừng trở lại</h1>
        <p>Đăng nhập vào tài khoản Aqua Sentinel AI của bạn</p>
      </div>

      <form (ngSubmit)="onLogin()" class="login-form">
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="label">Địa chỉ Email</label>
          <input id="email" type="email" [(ngModel)]="email" name="email" class="input-field"
            placeholder="Nhập địa chỉ email" required />
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="password" class="label">Mật khẩu</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" class="input-field"
            placeholder="Nhập mật khẩu" required />
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <div class="remember-me">
            <input id="rememberMe" type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="checkbox" />
            <label for="rememberMe" class="checkbox-label">Ghi nhớ đăng nhập</label>
          </div>
          <a href="#" class="forgot-password">Quên mật khẩu?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-button" [disabled]="loading">
          <span *ngIf="!loading">Đăng nhập</span>
          <span *ngIf="loading">Đang đăng nhập...</span>
        </button>
      </form>

      <!-- Sign Up Link -->
      <div class="signup-link">
        Chưa có tài khoản? <a href="/signup">Đăng ký tại đây</a>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
