<div class="signup-page">
  <app-header></app-header>

  <main class="signup-container">
    <div class="signup-box">
      <div class="signup-header">
        <h1>Tạo tài khoản</h1>
        <p>Tham gia Aqua Sentinel AI — bảo vệ trang trại của bạn với hệ thống giám sát nước thông minh hơn.</p>
      </div>

      <form (ngSubmit)="onSignup()" class="signup-form">
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

        <div class="form-group">
          <label class="label" for="fullName">Họ và tên</label>
          <input id="fullName" name="fullName" [(ngModel)]="fullName" class="input-field"
            placeholder="Nhập họ và tên của bạn" required />
        </div>

        <div class="form-group">
          <label class="label" for="email">Địa chỉ Email</label>
          <input id="email" type="email" name="email" [(ngModel)]="email" class="input-field"
            placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label class="label" for="password">Mật khẩu</label>
          <input id="password" type="password" name="password" [(ngModel)]="password" class="input-field"
            placeholder="Chọn mật khẩu mạnh" required />
        </div>

        <div class="form-group">
          <label class="label" for="confirmPassword">Xác nhận mật khẩu</label>
          <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
            class="input-field" placeholder="Nhập lại mật khẩu" required />
        </div>

        <button type="submit" class="signup-button" [disabled]="loading">
          <span *ngIf="!loading">Tạo tài khoản</span>
          <span *ngIf="loading">Đang đăng ký...</span>
        </button>
      </form>

      <div class="signin-link">Đã có tài khoản? <a href="/login">Đăng nhập</a></div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
