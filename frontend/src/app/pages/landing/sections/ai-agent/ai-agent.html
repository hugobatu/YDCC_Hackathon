<div class="ai-card" [class.active]="isActive">
  <mat-icon class="robot">smart_toy</mat-icon>
  <h3>Tác nhân AI</h3>
  <p>
    Các tác nhân tự động phân tích tin tức và dữ liệu cảm biến, đưa ra lời khuyên và kích hoạt cảnh báo sớm.
  </p>
  <div class="ai-status" *ngIf="isActive">
    <span class="status-dot"></span>
    <span>Đang hoạt động</span>
  </div>
</div>
