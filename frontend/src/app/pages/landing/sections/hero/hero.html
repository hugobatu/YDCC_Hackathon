<section class="hero">
  <!-- LEFT: TEXT -->
  <div class="hero-content">
    <h1>
      AI Water Quality Monitoring<br />
      for the Mekong Delta
    </h1>

    <p>
      Real-time monitoring and prediction of ammonia, temperature,
      dissolved oxygen, and pH to optimize aquaculture productivity.
    </p>

    <div class="hero-actions">
      <button class="btn btn-primary">Get Started</button>
      <button class="btn btn-outline">View Dashboard</button>
    </div>
  </div>

  <!-- RIGHT: SLIDER -->
  <div class="hero-slider">
    <div class="slider">
      <img
        *ngFor="let img of images; let i = index"
        [src]="img"
        [class.active]="i === currentIndex()"
        alt="Aquaculture"
      />
    </div>

    <!-- GRADIENT OVERLAY -->
    <div class="slider-gradient"></div>
  </div>
</section>
